<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd1dc, #ffe9f0, #fff5f8);
    font-family: 'Segoe UI', Georgia, serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 {
    color: #c2185b;
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(194, 24, 91, 0.15);
    margin-bottom: 40px;
    line-height: 1.3;
  }
  a.boton {
    background: #e91e63;
    color: white;
    text-decoration: none;
    padding: 16px 36px;
    font-size: clamp(16px, 4vw, 20px);
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(233, 30, 99, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    display: inline-block;
  }
  a.boton:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 24px rgba(233, 30, 99, 0.45);
  }
  a.boton:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>
  <h1>Ve con cuidado mi chiquita bella<br>Danna Sofía 💗</h1>
  <a class="boton" href="te-quiero.html" target="_blank" rel="noopener">Ábreme 💌</a>
</body>
</html>
